<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload / Edit Konten - FirWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 20px;">
        <div class="card">
            <h2 id="form-heading" style="color: var(--primary); margin-bottom: 15px;">Upload Konten</h2>
            
            <form id="upload-form">
                <input type="hidden" id="edit-id">
                <label>Game:</label>
                <select id="up-game" required>
                    <option value="minecraft">Minecraft</option>
                    <option value="roblox">Roblox</option>
                </select>

                <label>Kategori:</label>
                <select id="up-category" required></select>

                <label>Judul:</label>
                <input type="text" id="up-title" required>

                <label>Thumbnail (Pilih File Gambar):</label>
                <input type="file" id="up-thumb-file" accept="image/*">
                <input type="text" id="up-thumb-link" placeholder="Atau masukkan link gambar thumbnail">

                <label>Keterangan / Deskripsi:</label>
                <textarea id="up-desc" rows="3" required></textarea>

                <!-- Pilihan Robux khusus Avatar Roblox -->
                <div id="robux-wrapper" style="display: none;">
                    <label>Harga Robux:</label>
                    <input type="number" id="up-robux" value="0">
                </div>

                <!-- Script Builder Kebawah -->
                <div id="script-section" style="display: none;">
                    <label style="font-weight: bold;">Kolom Script:</label>
                    <div id="script-container" class="vertical-stack"></div>
                    <button type="button" id="add-script-btn" class="btn" style="background-color: #10b981; margin-top: 10px;">+ Tambah Kolom Script</button>
                </div>

                <!-- Pilihan Upload File atau Link -->
                <div id="file-link-section">
                    <label>Metode File:</label>
                    <select id="upload-method">
                        <option value="file">Upload File Langsung</option>
                        <option value="link">Gunakan Link Download</option>
                    </select>
                    <div id="input-file-wrap">
                        <input type="file" id="up-file">
                    </div>
                    <div id="input-link-wrap" style="display:none;">
                        <input type="text" id="up-link" placeholder="https://...">
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 15px;">Simpan Konten</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="color: var(--text-color); text-decoration: none;">Batal</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
                    </html>
