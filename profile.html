<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - FirWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 30px;">
        <div class="card" style="text-align: center;">
            <h2 id="profile-display-name">Nama</h2>
            <p id="profile-username" style="color: #64748b; margin-bottom: 20px;">@username</p>
            
            <div style="text-align: left; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <h4>Pengaturan Akun</h4>
                <label style="font-size:0.9rem; margin-top:10px; display:block;">Display Name (Bisa ubah tiap 7 hari):</label>
                <input type="text" id="new-display-name">
                <button id="save-display-btn" class="btn" style="margin-bottom: 15px;">Simpan Display Name</button>

                <label style="font-size:0.9rem; display:block;">Username (Bisa ubah tiap 30 bulan):</label>
                <input type="text" id="new-username">
                <button id="save-username-btn" class="btn" style="background-color: #d97706;">Simpan Username</button>
            </div>
            
            <div style="margin-top: 20px;">
                <a href="index.html" class="btn" style="background-color: #64748b;">Beranda</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
        </html>
