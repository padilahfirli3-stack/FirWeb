<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <span id="user-info">Halo, Tamu</span>
            <div>
                <select id="theme-selector" style="padding: 5px; margin-right: 10px; width: auto;">
                    <option value="light">Terang</option>
                    <option value="dark">Gelap</option>
                    <option value="system">Sistem</option>
                    <option value="gradient">Gradasi Custom</option>
                </select>
                <a href="login.html" class="btn" id="auth-btn">Sign In</a>
            </div>
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <h1 style="color: var(--primary); font-size: 2.5rem;">FIRWEB</h1>
            <p>Pilih kategori game:</p>
        </div>

        <div class="vertical-stack">
            <a href="content.html?game=minecraft" class="card" style="text-align:center; text-decoration:none; color:inherit;">
                <h2 style="color: #dc2626;">Minecraft</h2>
                <p>Skin, Add-on, Shader, dll</p>
            </a>
            <a href="content.html?game=roblox" class="card" style="text-align:center; text-decoration:none; color:inherit;">
                <h2 style="color: #0284c7;">Roblox</h2>
                <p>Map, Script, Avatar, Model</p>
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
    </html>
