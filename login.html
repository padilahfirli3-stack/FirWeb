<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - FirWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <h2 id="form-title" style="margin-bottom: 15px; color: #38bdf8; text-align: center;">Sign In</h2>
            
            <form id="auth-form">
                <input type="text" id="username" placeholder="Nama Pengguna / Username" required>
                <input type="password" id="password" placeholder="Kata Sandi / Password" required>
                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; text-align: center;" id="submit-btn">Masuk</button>
            </form>

            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                <span id="toggle-text">Belum punya akun?</span> 
                <a href="#" id="toggle-mode" style="color: #38bdf8; text-decoration: none;">Daftar (Sign Up)</a>
            </p>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none;">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
