<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FirWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <section>
            <h2 id="form-title" style="margin-bottom: 15px; color: #38bdf8;">Sign In / Sign Up</h2>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">*Nama <b>FirliOfc</b> otomatis menjadi Admin.</p>
            
            <form id="auth-form">
                <input type="text" id="username" placeholder="Masukkan Nama Akun" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn" style="width: 100%;">Masuk / Daftar</button>
            </form>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 0.9rem;">← Kembali ke Beranda</a>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
